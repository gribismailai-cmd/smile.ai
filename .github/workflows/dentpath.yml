name: DentPath tests
on:
  push:
    paths: ["dentapply/**", ".github/workflows/dentpath.yml"]
  pull_request:
    paths: ["dentapply/**", ".github/workflows/dentpath.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dentapply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate school data against schema
        run: pip install jsonschema==4.26.0 && python3 -I tools/validate_data.py
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Install Playwright Chromium
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: UI tests (iPhone 13, light + dark)
        run: node tests/ui.test.mjs
