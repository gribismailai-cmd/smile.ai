<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DesignGate ICT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: project bar → 5-phase stepper (TIA-598 fiber colour code 1–5) → checklist | sticky outcome panel → comment register → knowledge base */
:root{
  --bg:#f1f4f7; --surface:#ffffff; --surface2:#f7f9fb; --ink:#15202b; --muted:#5a6876; --line:#d8dee5; --accent:#1f5fa8;
  --f1:#2563c9; --f2:#d9701a; --f3:#24894f; --f4:#86562f; --f5:#66778a;
  --crit:#c22d2d; --major:#b4740c; --minor:#4b6a88; --ok:#1f7f4a;
  --crit-bg:#fbe9e9; --major-bg:#fbf1df; --minor-bg:#e8eef4; --ok-bg:#e4f3ea;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d25; --surface2:#1b232d; --ink:#e4e9ee; --muted:#93a0ad; --line:#2a3440; --accent:#6ea6ea;
  --f1:#5b93ee; --f2:#f0954a; --f3:#4fbf7f; --f4:#c08a5c; --f5:#9aabbd;
  --crit:#ff7070; --major:#efab45; --minor:#90b1d0; --ok:#55c487;
  --crit-bg:#3a1d1f; --major-bg:#382b14; --minor-bg:#1f2b38; --ok-bg:#16301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d25; --surface2:#1b232d; --ink:#e4e9ee; --muted:#93a0ad; --line:#2a3440; --accent:#6ea6ea;
  --f1:#5b93ee; --f2:#f0954a; --f3:#4fbf7f; --f4:#c08a5c; --f5:#9aabbd;
  --crit:#ff7070; --major:#efab45; --minor:#90b1d0; --ok:#55c487;
  --crit-bg:#3a1d1f; --major-bg:#382b14; --minor-bg:#1f2b38; --ok-bg:#16301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.small{padding:3px 8px;font-size:12px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0;width:100%}
textarea{resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:40px;height:40px;border-radius:8px;display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden;flex-shrink:0}
.mark span:nth-child(1){background:var(--f1)}.mark span:nth-child(2){background:var(--f2)}.mark span:nth-child(3){background:var(--f3)}.mark span:nth-child(4){background:var(--f4)}.mark span:nth-child(5){background:var(--f5)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.sample{border-color:var(--major);color:var(--major)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.proj{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}
.proj label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;min-width:0}
.proj input{text-transform:none;letter-spacing:0;font-weight:400;font-size:14px;color:var(--ink)}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.step{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 12px 10px 16px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.step::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.step[aria-pressed="true"]{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.step .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step .nm{font-family:var(--display);font-weight:700;font-size:14px}
.step .dp{font-size:12px;color:var(--muted)}
.step .sc{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px}
.meter{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pc)}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.side{position:sticky;top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px}
.phasehead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.focus{font-size:13px;color:var(--muted);max-width:70ch}
.legend{display:flex;flex-wrap:wrap;gap:6px}

/* checklist */
.cat{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cat>header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface2);gap:8px}
.cat>header h3{color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}
.row .chk{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.row .ref{font-family:var(--mono);font-size:11.5px}
.row .note{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);min-width:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[data-v="Y"][aria-pressed="true"]{background:var(--ok-bg);color:var(--ok)}
.seg button[data-v="N"][aria-pressed="true"]{background:var(--crit-bg);color:var(--crit)}
.seg button[data-v="NA"][aria-pressed="true"]{background:var(--minor-bg);color:var(--minor)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill.Critical{background:var(--crit-bg);color:var(--crit)}
.pill.Major{background:var(--major-bg);color:var(--major)}
.pill.Minor{background:var(--minor-bg);color:var(--minor)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.ty{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.ty.CMD{color:var(--crit)}.ty.HL{color:var(--major)}.ty.REC{color:var(--accent)}
.custom{font-size:10.5px;color:var(--f3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* metrics */
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.mtable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.mtable td.v{width:140px}
.mtable td.r{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tw{overflow-x:auto;min-width:0}
.res{font-size:12px;font-weight:600}
.res.ok{color:var(--ok)}.res.bad{color:var(--crit)}.res.warn{color:var(--major)}

/* tools */
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.calcout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kv{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kv b{font-family:var(--mono);font-size:16px;font-weight:500}
.etable{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.etable th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px;border-bottom:1px solid var(--line);font-weight:600}
.etable td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.etable input,.etable select{padding:4px 6px;font-size:13px}

/* outcome */
.outcome{border-top:5px solid var(--pc)}
.ringrow{display:flex;gap:16px;align-items:center}
.ring{width:120px;height:120px;flex-shrink:0}
.ring text{fill:var(--ink);font-family:var(--mono)}
.decision{display:flex;flex-direction:column;gap:4px;min-width:0}
.code{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.code.A{color:var(--ok)}.code.B{color:var(--major)}.code.C{color:var(--crit)}.code.I{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:12px}
.bar .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:4px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}

/* register */
.reg{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
.reg th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600;background:var(--surface2)}
.reg td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.reg td.no{font-family:var(--mono);font-size:12px;white-space:nowrap}
.reg tr.Critical td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.reg tr.Major td:first-child{box-shadow:inset 3px 0 0 var(--major)}
.reg tr.Minor td:first-child{box-shadow:inset 3px 0 0 var(--minor)}
.fb{display:flex;gap:4px}
.fb button{border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:11px;padding:2px 6px;color:var(--muted)}
.fb button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.kbgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:6px;font-size:13px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.explain{font-size:12.5px;color:var(--muted);max-width:75ch}
details summary{cursor:pointer;font-weight:600}

@media (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static}.kbgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.proj{grid-template-columns:repeat(2,minmax(0,1fr))}.proj label:first-child{grid-column:1/-1}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.calc,.calcout{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:minmax(0,1fr)}.form{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div>
        <h1>DesignGate ICT</h1>
        <div class="muted" style="font-size:13px">Telecom &amp; ICT engineering design review · 5 project phases · rules MVP</div>
      </div>
      <span class="tag sample" id="sampleTag">Sample data</span>
    </div>
    <div class="actions">
      <button class="btn" id="btnSample">Load sample project</button>
      <button class="btn" id="btnBlank">New blank review</button>
      <button class="btn primary" id="btnSave">Save review snapshot</button>
    </div>
  </header>

  <section class="panel" aria-label="Project">
    <div class="proj">
      <label>Project<input type="text" id="p_name" data-p="name"></label>
      <label>Project no.<input type="text" id="p_no" data-p="no"></label>
      <label>Document / Rev<input type="text" id="p_doc" data-p="doc"></label>
      <label>Reviewer<input type="text" id="p_rev" data-p="reviewer"></label>
      <label>Review date<input type="date" id="p_date" data-p="date"></label>
    </div>
  </section>

  <nav class="steps" id="steps" aria-label="Project phases"></nav>

  <div class="grid">
    <div class="col">
      <section class="panel" id="checklist"></section>
      <section class="panel" id="metrics"></section>
      <section class="panel" id="tool"></section>
    </div>
    <aside class="side">
      <section class="panel outcome" id="outcome"></section>
    </aside>
  </div>

  <section class="panel" id="register"></section>

  <section class="panel" id="kb"></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   KNOWLEDGE BASE (rules). Standards are cited by document name;
   reviewers must confirm the edition adopted by the AHJ / contract.
   Sev: Critical | Major | Minor.  Type: CMD (shall/mandatory) | HL (highlight/risk) | REC (recommendation/should)
   ============================================================ */
const I=(id,cat,check,ref,sev,type,action)=>({id,cat,check,ref,sev,type,action});
const PHASES=[
{key:'sc',pfx:'SC',n:1,name:'Scoping (DBSP)',long:'Design Basis Scoping Paper',depth:'High-level review',fiber:'Blue',color:'var(--f1)',threshold:70,gate:'Proceed to proposal',
 focus:'Confirms the design basis: owner requirements, applicable standards, systems in scope, space allocation and risk. No calculations are expected at this stage.',
 items:[
 I('sc01','Requirements','Owner project requirements (OPR) for ICT documented and signed off','BICSI TDMM — design process; PMI PMBOK requirements','Major','HL','Obtain OPR sign-off and attach the requirements list to the DBSP.'),
 I('sc02','Requirements','Stakeholders and authority having jurisdiction (AHJ) identified','PMI PMBOK — stakeholder register','Minor','REC','Add a stakeholder register including AHJ, owner IT, security and facilities.'),
 I('sc03','Standards basis','Codes & standards register lists TIA-568 series, TIA-569, TIA-606, TIA-607, NFPA 70 and local amendments','ANSI/TIA-568.0; NFPA 70 (NEC); local AHJ','Critical','CMD','Issue a standards register with document numbers and adopted editions before proposal.'),
 I('sc04','Standards basis','Data centre / critical space availability target stated (Rated level or Class)','ANSI/TIA-942; ANSI/BICSI 002','Major','HL','State the target availability level and its cost implications for the owner to confirm.'),
 I('sc05','Systems scope','Systems inventory defined: cabling, Wi-Fi, DAS/ERRCS, CCTV, access control, AV, BMS, PA','BICSI TDMM — systems integration','Major','HL','Complete the systems inventory and confirm in/out of scope per system.'),
 I('sc06','Site & spaces','Entrance facility with diverse service-provider routes considered','ANSI/TIA-569; ANSI/TIA-758','Major','REC','Show two physically diverse building entrances or record the accepted risk.'),
 I('sc07','Site & spaces','Equipment room and at least one telecom room per floor allocated','ANSI/TIA-569','Major','CMD','Allocate an ER and at least one TR per floor on the space plan.'),
 I('sc08','Site & spaces','Site survey / existing conditions captured','BICSI TDMM — site survey','Minor','REC','Carry out and attach a site survey (pathways, existing OSP, spaces).'),
 I('sc09','Risk & budget','Growth and spare-capacity assumption stated','BICSI TDMM','Minor','REC','State the growth allowance (e.g. % spare ports, strands, pathway fill).'),
 I('sc10','Risk & budget','Budget estimate class and contingency stated','AACE RP 18R-97','Minor','HL','State estimate class (typically Class 5 at scoping) and contingency %.'),
 I('sc11','Risk & budget','Risk and assumptions log started','PMI PMBOK — risk register','Minor','HL','Open a risk register; record top 5 technical and schedule risks.')],
 metrics:[
 {k:'reqCov',label:'OPR items mapped to scope',unit:'%',ref:'PMI PMBOK traceability',rule:v=>v<60?R('CMD','Major',`Only ${v}% of OPR items are mapped to scope.`,'Complete the requirements trace before the proposal phase.'):v<80?R('HL','Minor',`${v}% of OPR items mapped; target is ≥ 80% at scoping.`,'Close the remaining requirement gaps or record them as assumptions.'):null},
 {k:'stdCount',label:'Codes/standards listed in basis',unit:'count',ref:'ANSI/TIA-568.0',rule:v=>v<5?R('HL','Major',`Standards register lists ${v} documents.`,'List at least TIA-568, -569, -606, -607, NFPA 70 and AHJ amendments.'):null},
 {k:'area',label:'Largest floor plate',unit:'m²',ref:'ANSI/TIA-569',rule:null},
 {k:'trs',label:'TRs planned on that floor',unit:'count',ref:'ANSI/TIA-569',rule:(v,m)=>{const need=Math.max(1,Math.ceil((+m.area||0)/1000));return v<need?R('CMD','Major',`Floor of ${m.area} m² has ${v} TR(s); ${need} needed at ≤ 1,000 m² served per TR.`,'Add telecom rooms or confirm the served area per TR ≤ 1,000 m².'):null}},
 {k:'assume',label:'Open assumptions',unit:'count',ref:'PMI PMBOK',rule:v=>v>10?R('HL','Minor',`${v} open assumptions at scoping.`,'Validate or close assumptions with the owner before proposal.'):null}]},

{key:'pr',pfx:'PR',n:2,name:'Proposal',long:'Concept / proposal design',depth:'Light review, still high-level',fiber:'Orange',color:'var(--f2)',threshold:75,gate:'Proceed to detailed design',
 focus:'Checks the concept: topology, media selection, TR reach, pathway and grounding concept, integration matrix and commercial basis.',
 items:[
 I('pr01','Concept & topology','Hierarchical star topology defined (MC → IC → HC)','ANSI/TIA-568.0; ANSI/TIA-568.1','Major','CMD','Show the hierarchical star on a riser concept diagram.'),
 I('pr02','Concept & topology','TR locations give ≤ 90 m horizontal reach to every work area','ANSI/TIA-568.1; ISO/IEC 11801-1','Critical','CMD','Relocate or add TRs so every outlet is within 90 m route length.'),
 I('pr03','Media','Horizontal category selected and justified (Cat 6A for Wi-Fi APs)','TIA TSB-162-A; ANSI/TIA-568.2','Major','REC','Select Cat 6A for AP and PoE-dense outlets; record the justification.'),
 I('pr04','Media','Backbone media and strand counts stated (OS2 / OM4) incl. spare','ANSI/TIA-568.3','Minor','REC','State fibre type, strand count and spare per backbone segment.'),
 I('pr05','Spaces & pathways','Pathway concept stated (tray, conduit, J-hooks, risers)','ANSI/TIA-569','Minor','HL','Add a pathway concept sketch for horizontal and riser routes.'),
 I('pr06','Spaces & pathways','Grounding & bonding concept (TMGB, TGBs, TBB) included','ANSI/TIA-607','Major','CMD','Add the bonding concept diagram showing TMGB, TGBs and TBB.'),
 I('pr07','Spaces & pathways','Power and cooling allowance for ER/TRs stated','ANSI/TIA-569; ASHRAE TC 9.9','Major','HL','State kW per rack and cooling basis; coordinate with MEP.'),
 I('pr08','Integration','Low-voltage integration matrix drafted (who connects to what)','BICSI TDMM — systems integration','Major','HL','Issue the integration matrix: system, interface, owner, network segment.'),
 I('pr09','Commercial','Cost estimate with stated class and basis','AACE RP 18R-97','Minor','HL','Advance estimate to Class 4/3 and state the basis.'),
 I('pr10','Commercial','Schedule milestones and long-lead items listed','PMI PMBOK — schedule','Minor','REC','List long-lead items (e.g. switches, OSP materials) with lead times.'),
 I('pr11','Compliance','Draft compliance matrix against DBSP requirements','PMI PMBOK traceability','Major','HL','Issue a compliance matrix: requirement → design response → status.')],

function itemsOf(p){return p.items.concat(KB.custom.filter(c=>c.phase===p.key).map(c=>({...c,custom:true})))}

  return{loss,max:ap.loss,margin:ap.loss-loss,reach:ap.reach,len:+f.len,mediaOk:ft.m===ap.m,ap,ft}}

    if(s==='NA')return;applicable++;
    if(s){reviewed++;wRev+=W[it.sev];cats[it.cat].t+=W[it.sev]}
    if(s==='Y'){wY+=W[it.sev];cats[it.cat].y+=W[it.sev]}
    if(s==='N')add({key:it.id,type:it.type,sev:it.sev,cat:it.cat,finding:'Non-compliant: '+it.check+(d.notes[it.id]?' — '+d.notes[it.id]:''),action:it.action,ref:it.ref,src:it.custom?'Lesson learned':'Checklist'});
    if(!s&&p.key==='co')add({key:it.id,type:'HL',sev:it.sev,cat:it.cat,finding:'Not verified: '+it.check,action:'Verify on site/in records; unverified items count as open at closeout.',ref:it.ref,src:'Checklist'});
  });

    const r=mt.rule(val,d.m);if(r)add({key:'m:'+mt.k,cat:'Metrics',ref:mt.ref,src:'Metric',...r})});

  if(p.key==='cn')S.catalog.forEach((r,i)=>{if(catStatus(r)==='Mismatch')add({key:'cat:'+r.item,type:'CMD',sev:'Critical',cat:'Submittals & catalogue',finding:`Catalogue mismatch — ${r.item} (${r.attr}): spec “${r.req}”, submitted “${r.sub}”${r.mfr?' ['+r.mfr+']':''}.`,action:'Reject submittal item; resubmit a compliant product or request a formal deviation.',ref:'Project specification',src:'Catalogue'})});
  if(p.key==='co')S.punch.filter(r=>r.open).forEach(r=>add({key:'punch:'+r.id,type:'CMD',sev:r.sev,cat:'Punch list',finding:`Open punch ${r.id} at ${r.loc}: ${r.desc}`,action:'Close and verify before acceptance.',ref:'Closeout procedure',src:'Punch'}));
  const order={Critical:0,Major:1,Minor:2},torder={CMD:0,HL:1,REC:2};
  comments.sort((a,b)=>order[a.sev]-order[b.sev]||torder[a.type]-torder[b.type]);
  comments.forEach((c,i)=>c.no=p.pfx+'-'+String(i+1).padStart(3,'0'));
  const score=wRev?Math.round(100*wY/wRev):0;const coverage=applicable?Math.round(100*reviewed/applicable):0;
  const open=s=>comments.filter(c=>c.sev===s&&c.type!=='REC').length;
  const crit=open('Critical'),maj=open('Major');
  let dec;const needCov=p.key==='co'?100:80;
  if(coverage<needCov)dec={c:'I',t:'Review incomplete',d:`Coverage ${coverage}% is below the ${needCov}% needed for a decision at this phase.`};
  else if(crit>0)dec={c:'C',t:'C — Revise & resubmit',d:`${crit} critical finding(s) open. Gate “${p.gate}” is held.`};
  else if(p.key==='co'&&comments.some(c=>c.type!=='REC'))dec={c:'C',t:'C — Not ready for closeout',d:'Every command and highlight must be closed before acceptance.'};
  else if(score<p.threshold)dec={c:'C',t:'C — Revise & resubmit',d:`Weighted score ${score}% is below the ${p.threshold}% threshold.`};
  else if(maj>0)dec={c:'B',t:'B — Approved as noted',d:`Proceed: “${p.gate}”. Close ${maj} major comment(s) in the next submission.`};
  else dec={c:'A',t:'A — Approved',d:`Proceed: “${p.gate}”.`};
  return{score,coverage,applicable,reviewed,cats,comments,crit,maj,dec,items}
}

function fiberOut(fc){return`<div class="kv"><span>Calculated loss</span><b>${fc.loss.toFixed(2)} dB</b></div><div class="kv"><span>Application max</span><b>${fc.max.toFixed(2)} dB</b></div>
 <div class="kv"><span>Margin</span><b style="color:${fc.margin<0?'var(--crit)':fc.margin<1?'var(--major)':'var(--ok)'}">${fc.margin.toFixed(2)} dB</b></div><div class="kv"><span>Reach</span><b style="color:${fc.len>fc.reach?'var(--crit)':'var(--ok)'}">${fc.len} / ${fc.reach} m</b></div>`}

function ring(score,color){const C=2*Math.PI*50,off=C*(1-score/100);return`<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Weighted score ${score}%"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="50" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" font-size="24" font-weight="500">${score}%</text><text x="60" y="78" text-anchor="middle" font-size="10" fill="var(--muted)" style="fill:var(--muted)">weighted</text></svg>`}

function trend(h,p){if(h.length<2)return`<div class="muted" style="font-size:12px">${h.length?'1 snapshot saved. Save another to see a trend.':'No snapshots for this phase yet.'}</div>`;
  const w=320,ht=120,pad=24,x=i=>pad+i*(w-pad*2)/(h.length-1),y=v=>ht-pad-(v/100)*(ht-pad*1.6);
  const pts=h.map((s,i)=>`${x(i)},${y(s.score)}`).join(' ');
  return`<svg viewBox="0 0 ${w} ${ht}" style="width:100%;max-width:100%;height:auto" role="img" aria-label="Score trend">
  ${[0,50,100].map(v=>`<line x1="${pad}" x2="${w-pad}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad-4}" y="${y(v)+3}" font-size="9" text-anchor="end" style="fill:var(--muted)">${v}</text>`).join('')}
  <line x1="${pad}" x2="${w-pad}" y1="${y(p.threshold)}" y2="${y(p.threshold)}" stroke="var(--major)" stroke-dasharray="3 3"/>
  <polyline points="${pts}" fill="none" stroke="${p.color}" stroke-width="2"/>
  ${h.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.score)}" r="${i===h.length-1?4:2.5}" style="fill:${p.color}"/>`).join('')}
  <text x="${x(h.length-1)}" y="${y(h[h.length-1].score)-8}" font-size="10" text-anchor="end" style="fill:var(--ink)" font-family="var(--mono)">${h[h.length-1].score}%</text></svg>`}

  if(b.dataset.st){const d=S.ph[P().key];d.st[b.dataset.st]=d.st[b.dataset.st]===b.dataset.v?'':b.dataset.v;save();renderSteps();renderChecklist();renderOutcome();renderRegister();return}
  if(b.dataset.rf){regFilter=b.dataset.rf;renderRegister();return}
  if(b.dataset.fb){const k=b.dataset.fb,f=KB.fb[k]=KB.fb[k]||{u:0,d:0};f[b.dataset.dir]=(f[b.dataset.dir]||0)+1;f.last=b.dataset.dir;save();renderRegister();renderKB();toast('Feedback recorded');return}
  if(b.dataset.cdel!=null){S.catalog.splice(+b.dataset.cdel,1);save();renderTool();renderMetrics();light();return}
  if(b.dataset.pdel!=null){S.punch.splice(+b.dataset.pdel,1);save();renderTool();renderMetrics();light();return}
  if(b.dataset.ptog!=null){const r=S.punch[+b.dataset.ptog];r.open=!r.open;save();renderTool();renderMetrics();light();return}
  if(b.dataset.kdel!=null){KB.custom.splice(+b.dataset.kdel,1);save();renderAll();return}
  switch(b.id){
   case'btnSample':S=sample();save();renderAll();toast('Sample project loaded');break;
   case'btnBlank':S=blank();save();renderAll();toast('Blank review started');break;
   case'btnSave':{const p=P(),r=evaluate(p);KB.history.push({ts:new Date().toISOString(),phase:p.key,project:S.project.name,score:r.score,coverage:r.coverage,code:r.dec.c,crit:r.crit,maj:r.maj,keys:r.comments.map(c=>c.key)});save();renderKB();toast(`Snapshot saved: phase ${p.n}, ${r.score}%`);break}
   case'cAdd':S.catalog.push({item:'',attr:'',req:'',sub:'',mfr:'',eq:false});save();renderTool();break;
   case'pAdd':S.punch.push({id:'P-'+String(S.punch.length+1).padStart(3,'0'),loc:'',desc:'',disc:'',sev:'Minor',open:true});save();renderTool();renderMetrics();light();break;
   case'copyReg':{const r=evaluate(P());const tsv=[['No','Type','Severity','Category','Finding','Required action','Basis','Source'].join('\t'),...r.comments.map(c=>[c.no,TYPE_NAME[c.type],c.sev,c.cat,c.finding,c.action,c.ref,c.src].join('\t'))].join('\n');copy(tsv,'Register copied — paste into Excel');break}
   case'kbCopy':copy(JSON.stringify({custom:KB.custom,fb:KB.fb},null,1),'Knowledge base copied');break;
   case'kbImportBtn':$('#kbImport').hidden=!$('#kbImport').hidden;break;
   case'kbDoImport':try{const j=JSON.parse($('#kbText').value);(j.custom||[]).forEach(c=>{if(!KB.custom.some(x=>x.id===c.id))KB.custom.push(c)});Object.entries(j.fb||{}).forEach(([k,v])=>{const f=KB.fb[k]=KB.fb[k]||{u:0,d:0};f.u+=v.u||0;f.d+=v.d||0});save();renderAll();toast('Knowledge base merged')}catch(err){toast('Import failed: the text is not valid JSON')}break;
   case'histClear':KB.history=[];save();renderKB();toast('History cleared');break;
  }});
function copy(text,msg){const done=()=>toast(msg);try{navigator.clipboard.writeText(text).then(done,()=>fallback(text))}catch(e){fallback(text)}}
function fallback(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select and copy manually')}ta.remove()}
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.p){S.project[el.dataset.p]=el.value;S.sample=false;light();return}
  if(el.dataset.note){S.ph[P().key].notes[el.dataset.note]=el.value;light();return}
  if(el.dataset.m){S.ph[P().key].m[el.dataset.m]=el.value;const mt=P().metrics.find(m=>m.k===el.dataset.m);$('#res_'+mt.k).innerHTML=metricRes(P(),mt);light();return}
  if(el.dataset.f){S.fiber[el.dataset.f]=el.value;$('#fout').innerHTML=fiberOut(fiberCalc());renderMetrics();light();return}
  if(el.dataset.c){const tr=el.closest('tr'),r=S.catalog[+tr.dataset.ci];r[el.dataset.c]=el.type==='checkbox'?el.checked:el.value;tr.querySelector('.cs').innerHTML=catPill(r);renderMetrics();light();return}
  if(el.dataset.pu){const tr=el.closest('tr');S.punch[+tr.dataset.pi][el.dataset.pu]=el.value;light();return}
});
document.addEventListener('submit',e=>{if(e.target.id!=='kbForm')return;e.preventDefault();const p=P();const chk=$('#k_check').value.trim();if(!chk)return;
  KB.custom.push({id:'kb'+Date.now().toString(36),phase:p.key,cat:$('#k_cat').value.trim()||'Lessons learned',check:chk,ref:$('#k_ref').value.trim()||'Project lesson learned',sev:$('#k_sev').value,type:$('#k_type').value,action:$('#k_act').value.trim()||'Address per lessons learned.'});
  save();renderAll();toast(`Check added to phase ${p.n}`)});
renderAll();
</script>
